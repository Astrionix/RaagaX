name: Raaga
options:
  bundleIdPrefix: com.music
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: Raaga
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO

targets:
  Raaga:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Raaga
    info:
      path: Raaga/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.music.raaga
      INFOPLIST_FILE: Raaga/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGN_IDENTITY: ""
