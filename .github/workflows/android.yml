name: Android CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: android/**/*.gradle*

    - name: Setup local.properties & Secrets
      env:
        KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        if [ -n "$KEYSTORE_DATA" ]; then
          echo "$KEYSTORE_DATA" | base64 -d > raaga-release.jks
          cat << KEOF > keystore.properties
        storeFile=raaga-release.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        KEOF
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Android APK
      env:
        KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_DATA" ]; then
          ./gradlew assembleProdRelease assembleDevDebug
        else
          ./gradlew assembleDevDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: raaga-apk
        path: android/app/build/outputs/apk/**/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/apk/**/*.apk
        generate_release_notes: true
