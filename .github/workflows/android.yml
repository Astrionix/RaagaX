name: Android CI & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'desktop/**'
      - 'website/**'
      - 'cloudflare-relay/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/ios.yml'
      - '.github/workflows/update-contributors.yml'
      - 'README.md'
      - '**.md'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore:
      - 'desktop/**'
      - 'website/**'
      - 'cloudflare-relay/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/ios.yml'
      - '.github/workflows/update-contributors.yml'
      - 'README.md'
      - '**.md'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: '**/*.gradle*'

    - name: Setup local.properties & Strip local java home
      env:
        KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        sed -i '/org.gradle.java.home/d' gradle.properties
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        if [ -n "${{ secrets.LASTFM_API_KEY }}" ]; then
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
        fi
        if [ -n "${{ secrets.LASTFM_SECRET }}" ]; then
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        fi

        if [ -n "$KEYSTORE_DATA" ]; then
          echo "$KEYSTORE_DATA" | base64 -d > raaga-release.jks
          cat << KEOF > keystore.properties
        storeFile=raaga-release.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        KEOF
        fi

    - name: Accept Android SDK licenses
      run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install NDK and CMake
      run: |
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Android APK
      env:
        KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        ./gradlew assembleProdRelease assembleDevDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: raaga-apk
        path: app/build/outputs/apk/**/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/prod/release/*.apk
          app/build/outputs/apk/dev/debug/*.apk
        name: "Raaga ${{ github.ref_name }}"
        body: |
          ### Raaga ${{ github.ref_name }}

          **Aether Liquid Glass Audio Output Sheet & Intelligent Window Work-Area Protection.**

          #### Highlights & New Features:
          - **Liquid Glass Audio Output Sheet**: True localized optical refraction with tactile droplet pods and specular highlights on both Home and Expanded Player.
          - **Intelligent Window Protection**: Custom work-area insets on Windows & macOS ensure the Windows Taskbar, macOS Dock, and Menu Bar remain visible when maximized.
          - **Native macOS Controls**: Direct AppKit `- [NSWindow miniaturize:]` Dock animations and zoom handling.
          - **Cross-Platform Availability**: Installers and OTA updates available for Android, Windows, macOS, and Linux at https://raaga.me.
        make_latest: "true"
        generate_release_notes: false
