name: iOS Build & AltStore IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: |
        cd iosApp
        xcodegen generate

    - name: Build iOS App (.app)
      run: |
        xcodebuild build \
          -project iosApp/Raaga.xcodeproj \
          -scheme Raaga \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Package Unsigned IPA for AltStore / SideStore
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/Build/Products/Release-iphoneos/Raaga.app build/ipa/Payload/
        cd build/ipa
        zip -r -y ../../Raaga.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: raaga-ios-ipa
        path: Raaga.ipa

    - name: Attach IPA to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: Raaga.ipa
        generate_release_notes: true
