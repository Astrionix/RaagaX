name: Build & Release macOS Desktop App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to attach DMG to (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Universal DMG
    runs-on: macos-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Master App Icons
        run: node scripts/generate-desktop-icons.js

      - name: Export Next.js App Shell
        run: node scripts/export-app.js

      - name: Build macOS Universal DMG
        run: npx electron-builder --mac dmg --universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Built DMG
        id: find_dmg
        run: |
          ls -la dist/
          DMG_PATH=$(find dist -name "*.dmg" | head -n 1)
          echo "dmg_path=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "Found DMG: $DMG_PATH"

      - name: Upload DMG as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaagaX-macOS-Universal-dmg
          path: ${{ steps.find_dmg.outputs.dmg_path }}
          retention-days: 14

      - name: Attach DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name || 'v1.4.0' }}
        run: |
          echo "Uploading ${{ steps.find_dmg.outputs.dmg_path }} to release $TAG..."
          gh release upload "$TAG" "${{ steps.find_dmg.outputs.dmg_path }}" --clobber
