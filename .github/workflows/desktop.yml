name: Desktop CI & Release (Windows, Linux & macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (without leading v, e.g. 1.9.4)'
        required: true
        default: '1.9.4'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Linux · AppImage, deb, rpm
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building Linux packages for version $version"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file cmake g++
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build deb, rpm, and distributable
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Praaga.version=${{ steps.version.outputs.value }} -x test

      - name: Package AppImage
        run: |
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/Raaga \
            dist/Raaga-${{ steps.version.outputs.value }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect Linux artifacts
        run: |
          v="${{ steps.version.outputs.value }}"
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/Raaga-$v-linux-amd64.deb" 2>/dev/null || true
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/Raaga-$v-linux-x86_64.rpm" 2>/dev/null || true
          ls -lh dist

      - name: Upload Linux artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.value }}"
          gh release upload "v$v" dist/* --clobber --repo "${{ github.repository }}"

  macos:
    name: macOS · dmg, pkg, zip (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building macOS packages for version $version"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build DMG, PKG, and App bundle
        run: |
          ./gradlew :desktopApp:packageDmg :desktopApp:packagePkg :desktopApp:createDistributable \
            -Praaga.version=${{ steps.version.outputs.value }} -x test

      - name: Collect macOS artifacts
        run: |
          v="${{ steps.version.outputs.value }}"
          arch="${{ matrix.arch }}"
          mkdir -p dist
          for f in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "dist/Raaga-$v-macos-$arch.dmg"
          done
          for f in desktopApp/build/compose/binaries/main/pkg/*.pkg; do
            [ -f "$f" ] && cp "$f" "dist/Raaga-$v-macos-$arch.pkg"
          done
          if [ -d "desktopApp/build/compose/binaries/main/app/Raaga.app" ]; then
            ditto -c -k --keepParent desktopApp/build/compose/binaries/main/app/Raaga.app "dist/Raaga-$v-macos-$arch.zip"
          fi
          ls -lh dist

      - name: Upload macOS artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.value }}"
          gh release upload "v$v" dist/* --clobber --repo "${{ github.repository }}"

  windows:
    name: Windows · Installer (.exe, .msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: 'desktop/**/*.gradle*'

      - name: Work out version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Windows Installer
        shell: bash
        run: |
          ./gradlew :desktopApp:packageExe -Praaga.version=${{ steps.version.outputs.value }} --stacktrace

      - name: Upload Windows Installer to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          v="${{ steps.version.outputs.value }}"
          mkdir -p dist
          for f in desktopApp/build/compose/binaries/main/exe/*.exe; do
            [ -f "$f" ] && cp "$f" "dist/Raaga-$v-windows-setup.exe"
          done
          for f in desktopApp/build/compose/binaries/main/msi/*.msi; do
            [ -f "$f" ] && cp "$f" "dist/Raaga-$v-windows-setup.msi"
          done
          gh release upload "v$v" dist/* --clobber --repo "${{ github.repository }}"
